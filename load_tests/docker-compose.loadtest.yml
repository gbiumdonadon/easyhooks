# Docker Compose for Standalone Load Testing
# 
# This compose file runs Locust independently from the main application stack.
# It can test against local (localhost:8000) or remote APIs (staging, production).
#
# Usage:
#   # Test against local API
#   export LOADTEST_API_BASE_URL=http://host.docker.internal:8000
#   docker compose -f docker-compose.loadtest.yml up
#
#   # Test against remote API
#   export LOADTEST_API_BASE_URL=https://staging.easyhooks.io
#   export LOADTEST_ADMIN_TOKEN=your-token
#   docker compose -f docker-compose.loadtest.yml up
#
# Environment Variables:
#   LOADTEST_API_BASE_URL  - API endpoint to test (required)
#   LOADTEST_ADMIN_TOKEN   - Admin token for tenant creation (required)
#   LOADTEST_TENANT_COUNT  - Number of tenants to create (default: 50)
#   LOADTEST_TENANT_PREFIX - Prefix for tenant names (default: loadtest)
#   LOADTEST_WORKERS       - Number of Locust workers (default: 2)

services:
  # Initialization service: waits for API and creates test tenants.
  # The docker-entrypoint.sh resolves LOADTEST_ADMIN_TOKEN fallback before
  # this command runs, so we can validate it with a plain shell check.
  loadtest-init:
    build:
      context: ..
      dockerfile: load_tests/Dockerfile
    working_dir: /load_tests
    volumes:
      - .:/load_tests
    env_file:
      - path: ../.env
        required: false
    environment:
      - LOADTEST_API_BASE_URL=${LOADTEST_API_BASE_URL:-http://host.docker.internal:8000}
      - LOADTEST_TENANT_COUNT=${LOADTEST_TENANT_COUNT:-50}
      - LOADTEST_TENANT_PREFIX=${LOADTEST_TENANT_PREFIX:-loadtest}
    command:
      - sh
      - -c
      - |
        if [ -z "$$LOADTEST_ADMIN_TOKEN" ]; then
          echo "ERRO: LOADTEST_ADMIN_TOKEN nao configurado."
          echo "  Defina a variavel ou garanta que ADMIN_SEED_TOKEN esta no .env"
          exit 1
        fi
        echo "Verificando se API esta pronta..."
        /load_tests/wait-for-api.sh
        echo ""
        echo "Criando $$LOADTEST_TENANT_COUNT tenants de teste..."
        python utils/tenant_factory.py --create \
          --count "$$LOADTEST_TENANT_COUNT" \
          --prefix "$$LOADTEST_TENANT_PREFIX"
        echo ""
        echo "Ambiente pronto para testes de carga!"
    networks:
      - loadtest-network

  # Locust Master: Web UI and test coordination.
  # --host is resolved by Docker Compose at parse time (no shell escaping needed).
  locust-master:
    build:
      context: ..
      dockerfile: load_tests/Dockerfile
    working_dir: /load_tests
    ports:
      - "8089:8089"
      - "5557:5557"
    volumes:
      - .:/load_tests
    env_file:
      - path: ../.env
        required: false
    environment:
      - LOCUST_MODE=master
      - LOADTEST_API_BASE_URL=${LOADTEST_API_BASE_URL:-http://host.docker.internal:8000}
      - LOADTEST_TENANT_COUNT=${LOADTEST_TENANT_COUNT:-50}
      - LOADTEST_TENANT_PREFIX=${LOADTEST_TENANT_PREFIX:-loadtest}
    command:
      - locust
      - -f
      - /load_tests/locustfile.py
      - --master
      - --expect-workers=${LOADTEST_WORKERS:-2}
      - --host=${LOADTEST_API_BASE_URL:-http://host.docker.internal:8000}
    depends_on:
      loadtest-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - loadtest-network

  # Locust Workers: Generate the actual load.
  # Workers also receive --host so they can build the HTTP client independently.
  locust-worker:
    build:
      context: ..
      dockerfile: load_tests/Dockerfile
    working_dir: /load_tests
    volumes:
      - .:/load_tests
    env_file:
      - path: ../.env
        required: false
    environment:
      - LOCUST_MODE=worker
      - LOADTEST_API_BASE_URL=${LOADTEST_API_BASE_URL:-http://host.docker.internal:8000}
    command:
      - locust
      - -f
      - /load_tests/locustfile.py
      - --worker
      - --master-host=locust-master
      - --host=${LOADTEST_API_BASE_URL:-http://host.docker.internal:8000}
    depends_on:
      - locust-master
    deploy:
      replicas: ${LOADTEST_WORKERS:-2}
    restart: unless-stopped
    networks:
      - loadtest-network

networks:
  loadtest-network:
    driver: bridge
