# Load tests: create tenant pool then run Grafana k6 against the API.
#
# Start the main stack first (`docker compose up -d` from repo root). This file attaches
# to the stack network as `easyhooks_default` (default project name = directory name).
# k6 and init use the API at http://app:8000 on that network (no host.docker.internal).
#
# Usage (from repo root):
#   docker compose -f load_tests/docker-compose.loadtest.yml run --rm k6 run k6/scenarios/baseline.js
#
# Remote API / custom project name: set LOADTEST_API_BASE_URL, e.g.:
#   LOADTEST_API_BASE_URL=http://host.docker.internal:8000 docker compose -f load_tests/...
#
# Override scenario:
#   docker compose -f load_tests/docker-compose.loadtest.yml run --rm k6 run k6/scenarios/throughput.js

services:
  loadtest-init:
    image: alpine:3.20
    working_dir: /load_tests
    volumes:
      - .:/load_tests
    env_file:
      - path: ../.env
        required: false
    environment:
      LOADTEST_API_BASE_URL: ${LOADTEST_API_BASE_URL:-http://app:8000}
      LOADTEST_TENANT_COUNT: ${LOADTEST_TENANT_COUNT:-50}
      LOADTEST_TENANT_PREFIX: ${LOADTEST_TENANT_PREFIX:-loadtest}
      TENANT_POOL_FILE: /load_tests/.tenant_pool.json
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ -z "$$LOADTEST_ADMIN_TOKEN" ] && [ -n "$$ADMIN_SEED_TOKEN" ]; then
          export LOADTEST_ADMIN_TOKEN="$$ADMIN_SEED_TOKEN"
        fi
        if [ -z "$$LOADTEST_ADMIN_TOKEN" ]; then
          echo "ERROR: set LOADTEST_ADMIN_TOKEN or ADMIN_SEED_TOKEN in .env"
          exit 1
        fi
        apk add --no-cache curl jq >/dev/null
        chmod +x /load_tests/wait-for-api.sh /load_tests/scripts/create_tenant_pool.sh
        /load_tests/wait-for-api.sh
        /load_tests/scripts/create_tenant_pool.sh
    networks:
      - easyhooks_default

  k6:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /load_tests
    volumes:
      - .:/load_tests
    env_file:
      - path: ../.env
        required: false
    environment:
      LOADTEST_API_BASE_URL: ${LOADTEST_API_BASE_URL:-http://app:8000}
      TENANT_POOL_FILE: /load_tests/.tenant_pool.json
      # failure_tracking.js usa estas para gravar falhas no stream loadtest:dlq.
      # Os outros cenários ignoram silenciosamente (lib/dlq.js só conecta on demand).
      LOADTEST_REDIS_URL: ${LOADTEST_REDIS_URL:-redis://redis:6379/0}
      LOADTEST_DLQ_STREAM: ${LOADTEST_DLQ_STREAM:-loadtest:dlq}
      LOADTEST_DLQ_MAX_LEN: ${LOADTEST_DLQ_MAX_LEN:-50000}
      LOADTEST_FAILURE_RATIO: ${LOADTEST_FAILURE_RATIO:-0.10}
      LOADTEST_WORKER_DLQ_STREAM: ${LOADTEST_WORKER_DLQ_STREAM:-events:failed}
    depends_on:
      loadtest-init:
        condition: service_completed_successfully
    networks:
      - easyhooks_default
    command: ['run', 'k6/scenarios/baseline.js']

networks:
  easyhooks_default:
    external: true
