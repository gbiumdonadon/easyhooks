# =============================================================================
# EasyHooks — application stack (Redis-only)
# =============================================================================
# Run:
#   docker compose up -d
#
# To enable observability (Prometheus, Grafana, Jaeger, redis-exporter):
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Capacity profile (small / medium / large / custom):
#   Set EASYHOOKS_PROFILE in `.env` (or your shell) and pair it with the matching
#   container memory cap via EASYHOOKS_MEM_LIMIT. Recommended pairs:
#     small  -> EASYHOOKS_MEM_LIMIT=256m
#     medium -> EASYHOOKS_MEM_LIMIT=512m
#     large  -> EASYHOOKS_MEM_LIMIT=1g
#   The app uses GOMEMLIMIT (derived from EASYHOOKS_PROFILE) so the GC works hard
#   before hitting the OS-level cap and triggering the OOM killer.
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # AOF (every second) + RDB snapshots so admin/tenant credentials, idempotency
    # locks, the work queue (events:in / events:failed) and per-tenant streams
    # all survive restarts.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--save"
      - "60 1000"
    volumes:
      - redis-data:/data
    mem_limit: ${EASYHOOKS_MEM_LIMIT:-100m}
    memswap_limit: ${EASYHOOKS_MEM_LIMIT:-100m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ADMIN_SEED_TOKEN: ${ADMIN_SEED_TOKEN}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      EVENT_STREAM_KEY: ${EVENT_STREAM_KEY:-events:in}
      DLQ_STREAM_KEY: ${DLQ_STREAM_KEY:-events:failed}
      CONSUMER_GROUP: ${CONSUMER_GROUP:-webhook-workers}
      EASYHOOKS_PROFILE: ${EASYHOOKS_PROFILE:-small}
    mem_limit: ${EASYHOOKS_MEM_LIMIT:-30m}
    memswap_limit: ${EASYHOOKS_MEM_LIMIT:-30m}
    depends_on:
      redis:
        condition: service_healthy
    command: ["/app/api"]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      EVENT_STREAM_KEY: ${EVENT_STREAM_KEY:-events:in}
      DLQ_STREAM_KEY: ${DLQ_STREAM_KEY:-events:failed}
      CONSUMER_GROUP: ${CONSUMER_GROUP:-webhook-workers}
      EASYHOOKS_PROFILE: ${EASYHOOKS_PROFILE:-small}
    mem_limit: ${EASYHOOKS_MEM_LIMIT:-30m}
    memswap_limit: ${EASYHOOKS_MEM_LIMIT:-30m}
    depends_on:
      redis:
        condition: service_healthy
    command: ["/app/worker"]
    restart: unless-stopped

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    mem_limit: ${EASYHOOKS_MEM_LIMIT:-256m}
    memswap_limit: ${EASYHOOKS_MEM_LIMIT:-256m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
