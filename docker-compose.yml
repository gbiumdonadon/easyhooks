# =============================================================================
# EasyHooks — application stack (Redis-only)
# =============================================================================
# Run:
#   docker compose up -d
#
# To enable observability (Prometheus, Grafana, Jaeger, redis-exporter):
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # AOF (every second) + RDB snapshots so admin/tenant credentials, idempotency
    # locks, the work queue (events:in / events:failed) and per-tenant streams
    # all survive restarts.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--save"
      - "60 1000"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Capacity profile (small / medium / large)
  # ---------------------------------------------------------------------------
  # Set EASYHOOKS_PROFILE in your .env (or shell) to one of:
  #   small  — pair with `mem_limit: 256m`
  #   medium — pair with `mem_limit: 512m`
  #   large  — pair with `mem_limit: 1g`
  #   custom — set every memory-related env var explicitly
  #
  # The profile is propagated into both `app` and `worker` containers below.
  # The mem_limit on the container side is the OS-level cap; the app uses
  # GOMEMLIMIT (derived from the profile) so the GC works hard before hitting
  # this cap and triggering the OOM killer.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ADMIN_SEED_TOKEN: ${ADMIN_SEED_TOKEN}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      EVENT_STREAM_KEY: ${EVENT_STREAM_KEY:-events:in}
      DLQ_STREAM_KEY: ${DLQ_STREAM_KEY:-events:failed}
      CONSUMER_GROUP: ${CONSUMER_GROUP:-webhook-workers}
      EASYHOOKS_PROFILE: ${EASYHOOKS_PROFILE:-small}
    # Recommended container caps per profile:
    #   small  -> mem_limit: 256m
    #   medium -> mem_limit: 512m
    #   large  -> mem_limit: 1g
    # mem_limit: 256m
    depends_on:
      redis:
        condition: service_healthy
    command: ["/app/api"]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      EVENT_STREAM_KEY: ${EVENT_STREAM_KEY:-events:in}
      DLQ_STREAM_KEY: ${DLQ_STREAM_KEY:-events:failed}
      CONSUMER_GROUP: ${CONSUMER_GROUP:-webhook-workers}
      EASYHOOKS_PROFILE: ${EASYHOOKS_PROFILE:-small}
    # Same recommendation as `app` — keep both containers on matching caps.
    # mem_limit: 256m
    depends_on:
      redis:
        condition: service_healthy
    command: ["/app/worker"]
    restart: unless-stopped

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
