# =============================================================================
# EasyHooks — capacity benchmark override
# =============================================================================
# Applies the mem_limit recommended for the active EASYHOOKS_PROFILE so the
# benchmark script can measure how each tier behaves at the OS-level cap.
#
# Usage:
#   $env:EASYHOOKS_PROFILE = "small"
#   $env:EASYHOOKS_MEM_LIMIT = "256m"
#   docker compose -f docker-compose.yml -f docker-compose.capacity.yml up -d
# =============================================================================
services:
  app:
    mem_limit: ${EASYHOOKS_MEM_LIMIT:-256m}
    memswap_limit: ${EASYHOOKS_MEM_LIMIT:-256m}
    environment:
      EASYHOOKS_PROFILE: ${EASYHOOKS_PROFILE:-small}
  worker:
    mem_limit: ${EASYHOOKS_MEM_LIMIT:-256m}
    memswap_limit: ${EASYHOOKS_MEM_LIMIT:-256m}
    environment:
      EASYHOOKS_PROFILE: ${EASYHOOKS_PROFILE:-small}
