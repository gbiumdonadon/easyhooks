# Docker Compose overrides for load testing
# Usage: docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d

services:
  # Scale workers for higher throughput
  worker:
    deploy:
      replicas: 4
    environment:
      # Reduce tracing overhead during load tests
      TRACING_SAMPLE_RATE: 0.1
      # Increase worker concurrency
      WORKER_MAX_RETRIES: 3
      WORKER_BACKOFF_BASE_MS: 50
    cpus: 4
    mem_limit: 4g

  # Optimize API for high load
  app:
    environment:
      # Reduce tracing overhead
      TRACING_SAMPLE_RATE: 0.1
      # Increase connection pools
      DATABASE_POOL_SIZE: 50
      REDIS_POOL_SIZE: 200
    cpus: 4
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Kafka optimizations
  kafka:
    environment:
      # Increase partitions for parallel processing
      KAFKA_NUM_PARTITIONS: 8
      # Increase buffer sizes
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 1048576
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      # Increase replication
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    cpus: 2
    mem_limit: 2g

  # Redis optimizations
  redis:
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
    cpus: 2
    mem_limit: 2g

  # PostgreSQL optimizations
  db:
    environment:
      # Increase connections
      POSTGRES_MAX_CONNECTIONS: 200
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=2621kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    cpus: 2
    mem_limit: 2g

  # Keep monitoring stack lightweight during load tests
  prometheus:
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=1h'  # Short retention during tests
      - '--web.enable-lifecycle'

  jaeger:
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=10000  # Limit memory usage

  # Locust service for distributed load testing
  locust-master:
    build:
      context: .
      dockerfile: load_tests/Dockerfile
    ports:
      - "8089:8089"
      - "5557:5557"
    volumes:
      - ./load_tests:/load_tests
    environment:
      - LOCUST_MODE=master
      - LOADTEST_API_BASE_URL=http://app:8000
      - LOADTEST_ADMIN_TOKEN=${ADMIN_SEED_TOKEN}
    command: >
      locust
      -f /load_tests/locustfile.py
      --master
      --expect-workers=2
      --host=http://app:8000
    depends_on:
      - app
    cpus: 1
    mem_limit: 1g

  locust-worker:
    build:
      context: .
      dockerfile: load_tests/Dockerfile
    volumes:
      - ./load_tests:/load_tests
    environment:
      - LOCUST_MODE=worker
      - LOADTEST_API_BASE_URL=http://app:8000
      - LOADTEST_ADMIN_TOKEN=${ADMIN_SEED_TOKEN}
    command: >
      locust
      -f /load_tests/locustfile.py
      --worker
      --master-host=locust-master
    depends_on:
      - locust-master
    deploy:
      replicas: 2
    cpus: 1
    mem_limit: 1g
