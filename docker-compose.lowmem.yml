# =============================================================================
# EasyHooks — perfil de baixa memória (~512MB total)
# =============================================================================
# Override que aplica limites de memória em TODOS os serviços (aplicação +
# observabilidade) para simular execução em uma máquina de ~512MB de RAM.
# Útil para validar comportamento dos testes de carga sob restrição forte.
#
# Uso (apenas aplicação):
#   docker compose -f docker-compose.yml -f docker-compose.lowmem.yml up -d
#
# Uso (aplicação + observabilidade):
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.monitoring.yml \
#                  -f docker-compose.lowmem.yml up -d
#
# Orçamento aproximado:
#   redis  64M | app  96M | worker 64M | docs 32M
#   prom   80M | graf 64M | jaeger 48M | redis-exp 16M
#   ~464MB de containers + ~48MB de folga para o SO/kernel = ~512MB
#
# Observações:
#   - mem_reservation < mem_limit: ajuda o kernel sob pressão.
#   - Redis usa policy `noeviction` (NÃO `allkeys-lru`) porque os streams
#     `events:in` / `events:failed` são fila de trabalho — eviction perderia
#     eventos. Sob carga vamos preferir backpressure (ERR OOM) a perda de
#     dados; aumente `maxmemory` se necessário.
#   - GOMEMLIMIT/GOGC fazem o GC do Go respeitar o cgroup (evita OOMKill).
#   - Prometheus reduzido: retenção 1h + scrape de 30s. Suficiente para
#     observar uma janela de teste de carga.
#   - Jaeger limitado a 2000 traces em memória (FIFO).
# =============================================================================

services:
  redis:
    mem_limit: 64m
    mem_reservation: 48m
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--save"
      - "60 1000"
      - "--maxmemory"
      - "48mb"
      - "--maxmemory-policy"
      - "noeviction"

  app:
    mem_limit: 96m
    mem_reservation: 64m
    environment:
      GOMEMLIMIT: "80MiB"
      GOGC: "50"

  worker:
    mem_limit: 64m
    mem_reservation: 48m
    environment:
      GOMEMLIMIT: "50MiB"
      GOGC: "50"

  docs:
    mem_limit: 32m
    mem_reservation: 24m

  prometheus:
    mem_limit: 80m
    mem_reservation: 64m
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=1h'
      - '--storage.tsdb.retention.size=128MB'
      - '--storage.tsdb.wal-compression'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--query.max-samples=5000000'

  grafana:
    mem_limit: 64m
    mem_reservation: 48m
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_SERVER_ROOT_URL:-http://localhost:3000}
      - GF_INSTALL_PLUGINS=
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_LOG_LEVEL=warn

  jaeger:
    mem_limit: 48m
    mem_reservation: 32m
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=2000
      - QUERY_MAX_CLOCK_SKEW_ADJUSTMENT=0s

  redis-exporter:
    mem_limit: 16m
    mem_reservation: 12m
